render()}
function nxt(){snap();S.fx=null;S.i++;render()}
function undo(){if(H.length){S=JSON.parse(H.pop());render()}}
function rst(){const b=$('#rs');if(b.dataset.c){clearTimeout(rsT);delete b.dataset.c;b.textContent='Reiniciar';init();render()}else{b.dataset.c=1;b.textContent='Confirmar?';rsT=setTimeout(()=>{delete b.dataset.c;b.textContent='Reiniciar'},3000)}}
function traj(){const m=S.m,t=m.C>=8&&m.R>=7;return m.A>=9&&!t?0:t&&m.A>=7?1:(t||m.K>=6)&&m.A<=7?2:3}
function chip(d){return['Alcance','Engaj.','Confiança','Coerência'].map((x,n)=>d[n]?x+' '+(d[n]>0?'+':'')+d[n]:'').filter(Boolean).join(' · ')||'sem mudança'}

const ABC='ABC',PK=['look','expr','niche','val','img'],CQN=['Aparência','Comunicação','Nicho','Valores','Imagem'],DAY={r0:1,r1:3,d0:5,r2:6,d1:8,r3:9,d2:11},
NF=['Linha Mansa · Proposta de parceria','Mensagem direta · Pedido de opinião','Comentários · «Mostra mais da sua vida»'],
SN=[['A','Alcance','#F4C36B'],['E','Engajamento','#FF6B57'],['C','Confiança','#4FD6A0'],['K','Coerência','#8DB4FF'],['R','Reputação','#F6EFE8']],
DEF={A:'quantos veem',E:'quanto reagem',C:'quanto acreditam',K:'se combina com o que ela disse ser',R:'muda devagar: acompanha confiança e coerência'},
MOOD={calm:['Estável','#F6EFE8'],success:['Em alta','#F4C36B'],growth:['Crescimento','#4FD6A0'],doubt:['Dúvida','#C9A66B'],crisis:['Crise','#FF4B3E']};
const hue=s=>[...s].reduce((a,c)=>a*31+c.charCodeAt(0),7)%360;
const im=(f,c)=>`<div class="im ${c||''}" style="--h:${hue(f)}" data-f="img/${f}.jpg"><img src="img/${f}.jpg" alt="" onerror="this.remove()"></div>`;
function mood(f){const m=S.m;return m.C<=3||f.d[2]<=-2?'crisis':f.d[2]<0||f.d[3]<0?'doubt':m.R>=7&&f.d[2]>0?'growth':f.d[0]>=2?'success':'calm'}
const fol=()=>(900+S.m.A*2300+S.m.R*700).toLocaleString('pt-BR');
function hud(){const f=S.fx,d=DAY[ST[S.i]];return`<div class="hud"><div class="day"><small>Dia</small><b>${d||'—'}</b></div>`+SN.map((x,n)=>`<div class="st" style="--c:${x[2]};--v:${S.m[x[0]]}"><small>${x[1]}</small><b>${S.m[x[0]]}</b><i></i>${f&&f.d[n]?`<u class="${f.d[n]>0?'up':'dn'}">${f.d[n]>0?'+':''}${f.d[n]}</u>`:''}</div>`).join('')+`<div class="md" style="--c:${MOOD[S.mood][1]}"><small>Momento</small><b>${MOOD[S.mood][0]}</b></div></div>`}
function phone(x){return`<div class="phone"><div class="pn"><div class="av">${im('avatar')}</div><div><b>nara.teodoro</b><small>${fol()} seguidores · dado cenográfico</small></div></div>${x}</div>`}
const feed=()=>'<div class="grid">'+Array.from({length:9},(_,i)=>S.feed[i]?im('post_'+S.feed[i]):'<div class="e"></div>').join('')+'</div>';
function pv(n,k){if(n==0){$('.por').firstElementChild.outerHTML=im('look_'+ABC[k],'ptr')}else $('#pv').innerHTML=im(PK[n]+'_'+ABC[k])+'<small>'+CO[n][k][0]+'</small>'}
function bgName(){const s=ST[S.i],l=S.p.c0===undefined?'A':ABC[S.p.c0];if(s=='title'||s=='how'||s=='end1')return'hero';if(s[0]=='c')return'room_base';if(s=='prof'||s[0]=='r')return'studio_'+l;if(s[0]=='d')return['event_marca','event_polemica','event_privado'][+s[1]];return'end_'+traj()}
function ui(){const s=ST[S.i],p=S.p,n=+s[1],f=S.fx,L=p.c0===undefined?'A':ABC[p.c0],T=TR[traj()],fx=f&&s[0]!='c'&&s[0]!='p';
if(s=='title')return`<div class="ttl"><small class="k">Um jogo sobre fama, confiança e quem decide</small><h1>INFLUENCE</h1><p class="lead">Nara tem 28 anos, uma câmera e nenhuma audiência. Ela ainda não existe. Vocês vão decidir quem ela é, o que mostra e até onde vai para ser vista.</p><p class="obj"><b>Objetivo</b>Construir uma influência que se sustente. Alcance sozinho não basta.</p><button class="btn" data-go onclick="nxt()">Iniciar</button></div>`;
if(s=='how')return`<div class="brf"><small class="k">Briefing</small><h1>Vocês decidem. Uma pessoa clica.</h1><p class="lead">Em cada decisão, o grupo discute e vota. O operador clica na opção vencedora (ou aperta 1, 2, 3). </p><ul>${SN.map(x=>`<li style="--c:${x[2]}"><b>${x[1]}</b>${DEF[x[0]]}</li>`).join('')}</ul><button class="btn" data-go onclick="nxt()">Criar a personagem</button></div>`;
if(s[0]=='c')return`<div class="cre"><ol class="rail">${CQN.map((q,i)=>`<li class="${i==n?'on':p['c'+i]!==undefined?'ok':''}"><b>${q}</b><span>${p['c'+i]!==undefined?CO[i][p['c'+i]][0]:'—'}</span></li>`).join('')}</ol><div class="por">${im(p.c0===undefined?'nara_base':'look_'+L,'ptr')}</div><div id="pv" class="pv"></div></div><div class="tiles">${CO[n].map((o,k)=>`<button class="tile" onmouseenter="pv(${n},${k})" onfocus="pv(${n},${k})" onclick="pick(${k})"><i>${k+1}</i>${im(PK[n]+'_'+ABC[k])}<div><small class="k">${CQ[n]}</small><b>${o[0]}</b><span>${o[1]}</span></div></button>`).join('')}</div>`;
if(s=='prof')return`<div class="por">${im('look_'+L,'ptr')}</div><div class="sheet"><small class="k">Perfil criado</small><h2>Nara Teodoro, 28 anos</h2>${[0,1,2,3,4].map(i=>`<div class="row"><small>${CQN[i]}</small><b>${CO[i][p['c'+i]][0]}</b></div>`).join('')}<p class="sm">Contradição dela: ${PERS[p.c1][3]}</p><button class="btn" data-go onclick="nxt()">Publicar</button></div>`;
if(fx){const isR=s[0]=='r',mo=MOOD[S.mood];return`<div class="nar"><div class="mp">${im('mood_'+S.mood)}</div><small class="k">${isR?'Fase 3 · O público reage':'Fase 4 · Consequência'}</small><h2>${f.t}</h2><p class="tx">${f.tx||''} ${isR?'':f.cap}</p><p class="sm">Momento: <b style="color:${mo[1]}">${mo[0]}</b> · ${chip(f.d.slice(0,4))} · Reputação ${f.d[4]>0?'+':''}${f.d[4]}</p><button class="btn" data-go onclick="nxt()">${isR?'Próximo dia':'Continuar'}</button></div>`+phone((isR?`<div class="pst">${im('post_'+f.id)}<p><b>nara.teodoro</b> ${f.cap}</p></div>`:'')+`<div class="cm">${f.cm.map((c,i)=>`<div class="cmt" style="--c:${CT[c[0]][1]};--i:${i}"><u>${CT[c[0]][0]} · comentário fictício</u><b>@${c[1]}</b> ${c[2]}</div>`).join('')}</div>`)}
if(s[0]=='r')return`<div class="sit"><small class="k">Fase 2 · Publicar · ${n+1} de 4</small><p>${RS[n]}</p></div><div class="drafts">${OPT[n].map((id,k)=>`<button class="draft" onclick="pick(${k})"><i>${k+1}</i>${im('post_'+id)}<div class="cap"><b>${PD[id].n}</b><span>${PD[id].c}</span></div></button>`).join('')}</div>`+phone(feed());
if(s[0]=='d')return`<div class="ntf"><i>Agora</i><b>${NF[n]}</b><p>${DL[n].s}</p></div><div class="evh"><small class="k">Fase 4 · Acontecimento ${n+1} de 3</small><h2>${DL[n].h}</h2></div><div class="acts">${DL[n].o.map((o,k)=>`<button class="act" onclick="pick(${k})"><i>${k+1}</i><b>${o[0]}</b><span>${o[1]}</span></button>`).join('')}</div>`;
if(s=='end0')return`<div class="end"><small class="k">Edição final · Nara Teodoro</small><h1>${T[0]}</h1><p class="lead">${T[1]}</p><ol class="tl">${S.log.map(l=>`<li><b>${l.t}</b><em>${chip(l.d)}</em></li>`).join('')}</ol><p class="sm">Trajetória possível do jogo, não resultado sobre influenciadores reais.</p><button class="btn" data-go onclick="nxt()">A revelação</button></div>`;
return`<div class="brf"><small class="k">Revelação</small><p class="lead">A Nara não existe. O rosto, as imagens e os textos foram feitos com IA. A trajetória veio das decisões de vocês e de reações simuladas. Alcance, engajamento, confiança e reputação não eram a mesma coisa. O valor de uma imagem depende de quem a reconhece: ideia associada ao poder simbólico, em Pierre Bourdieu.</p><p class="q">Ela foi criada por inteligência artificial. Mas quem decidiu que ela seria perfeita?</p><p class="q2">Se nós ajudamos a decidir o que merece atenção, confiança e reconhecimento, até que ponto também participamos da construção da influência?</p><button class="btn" onclick="rstNow()">Jogar de novo</button></div>`}
function rstNow(){init();render()}
function render(){sel=null;$('#cf').style.display='none';const a=$('#app'),g=S.i>=R0,m=MOOD[S.mood][1];a.dataset.mood=g?S.mood:'calm';a.style.setProperty('--mc',g&&S.mood!='calm'?m+'66':'transparent');a.style.setProperty('--acc',g&&S.mood!='calm'?m:'#FF6B57');
a.innerHTML=`<div class="bg">${im(bgName())}</div><div class="shade"></div><div class="vig"></div>`+(g&&ST[S.i]!='end1'?hud():'')+`<div class="ui">${ui()}</div>`;const w=$('#cut');w.className='';void w.offsetWidth;w.className='sw'}
document.addEventListener('keydown',e=>{const k=e.key;if(k>='1'&&k<='3')pick(+k-1);else if(k=='z'||k=='Z')undo();else if(k=='Enter'||k==' '){const b=$('[data-go]');if(sel!==null){e.preventDefault();pick(sel)}else if(b){e.preventDefault();b.click()}}});
let sel=null;
function mark(k){const s=ST[S.i],els=document.querySelectorAll('.tile,.draft,.act');if(k>=els.length)return;sel=k;els.forEach((e,i)=>e.classList.toggle('sel',i==k));const c=$('#cf');c.style.display='block';c.textContent='Opção '+(k+1)+' · Enter ou clique de novo para confirmar';if(s[0]=='c')pv(+s[1],k)}
function pick(k){const s=ST[S.i];if(S.fx||s.length!=2||!'crd'.includes(s[0]))return;if(sel===k){sel=null;doPick(k)}else mark(k)}
init();render();
</script>
</body>
</html>
